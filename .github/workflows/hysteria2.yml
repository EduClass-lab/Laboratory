
name: Hysteria2 Collector and Speed Tester

on:
  workflow_dispatch:

  schedule:
  - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: hysteria2-collector
  cancel-in-progress: false

jobs:
  collect-test-sort:
    name: Collect and Test Hysteria2
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install Latest sing-box
        shell: bash
        run: |
          set -euo pipefail

          # echo "Fetching latest stable sing-box release..."

          # RELEASE_JSON=$(curl -fsSL \
          #   https://api.github.com/repos/SagerNet/sing-box/releases/latest)

          # DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '
          #   .assets[]
          #   | select(.name | test("linux-amd64\\.tar\\.gz$"))
          #   | .browser_download_url
          # ' | head -n 1)

          # if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
          #   echo "Could not find sing-box Linux AMD64 release."
          #   exit 1
          # fi

          # echo "Downloading: $DOWNLOAD_URL"

          # curl -fsSL "$DOWNLOAD_URL" -o sing-box.tar.gz

          # mkdir -p sing-box-extract

          # tar -xzf sing-box.tar.gz \
          #   -C sing-box-extract \
          #   --strip-components=1

          sudo install \
            sing-box-extract/sing-box \
            /usr/local/bin/sing-box

          sing-box version

      - name: Collect, Test and Sort Hysteria2 Servers
        env:
          MAX_WORKERS: "10"
          CONNECT_TIMEOUT: "15"
          DOWNLOAD_TIMEOUT: "35"
          MIN_SPEED: "16"
        run: |
          python scripts/hysteria2_tester.py

      
      - name: Show Results
        continue-on-error: true
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "Hysteria2 Results"
          echo "=================================="

          OUTPUT_FILE="results/hysteria2.txt"
          BACKUP_FILE="results/$(date +'%Y')/$(date +'%m')/$(date +'%d').txt"

          if [ -f "$OUTPUT_FILE" ]; then
            echo ""
            echo "Valid servers:"
            wc -l < "$OUTPUT_FILE"

          echo "=================================="

            echo ""
            echo "First 10 servers:"
            head -n 10 "$OUTPUT_FILE"

          echo "=================================="

            echo ""
            echo "Output file:"
            echo "$OUTPUT_FILE"

            echo ""
            echo "Daily backup:"
            if [ -f "$BACKUP_FILE" ]; then
              echo "$BACKUP_FILE"
              echo "Backup lines:"
              wc -l < "$BACKUP_FILE"
            else
              echo "Backup file not found."
            fi

          else
            echo "No result file found."
          fi

          echo ""
          echo "=================================="

      - name: Commit & push  changes
        continue-on-error: true
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          
          # 1. Get latest from remote
          echo "🔄 Pulling latest changes..."
          git pull origin dev-01 || {
            echo "⚠️  Pull failed, trying with rebase..."
            git pull origin dev-01 --rebase
          }
          
          # 2. Check if previous step made any changes
          echo "📊 Checking for changes..."
          if [ -z "$(git status --porcelain)" ]; then
            echo "✅ No changes detected - nothing to commit"
            exit 0
          fi
          
          # 3. Show what changed
          echo "📝 Changes detected:"
          git status --porcelain
          
          # 4. Stage and commit
          echo "💾 Committing changes..."
          git add -A
          git commit -m "Hysteria2 Servers Archived - $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S') 🌿"
          
          # 5. Push
          echo "🚀 Pushing to GitHub..."
          git push origin dev-01
          echo "✅ Done!"










