
name: Hysteria2 Collector and Speed Tester

on:
  workflow_dispatch:

  schedule:
  - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: hysteria2-collector
  cancel-in-progress: false

jobs:
  collect-test-sort:
    name: Collect and Test Hysteria2
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install Latest sing-box
        shell: bash
        run: |
          set -euo pipefail

          # echo "Fetching latest stable sing-box release..."

          # RELEASE_JSON=$(curl -fsSL \
          #   https://api.github.com/repos/SagerNet/sing-box/releases/latest)

          # DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '
          #   .assets[]
          #   | select(.name | test("linux-amd64\\.tar\\.gz$"))
          #   | .browser_download_url
          # ' | head -n 1)

          # if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
          #   echo "Could not find sing-box Linux AMD64 release."
          #   exit 1
          # fi

          # echo "Downloading: $DOWNLOAD_URL"

          # curl -fsSL "$DOWNLOAD_URL" -o sing-box.tar.gz

          # mkdir -p sing-box-extract

          # tar -xzf sing-box.tar.gz \
          #   -C sing-box-extract \
          #   --strip-components=1

          sudo install \
            sing-box-extract/sing-box \
            /usr/local/bin/sing-box

          sing-box version

      - name: Collect, Test and Sort Hysteria2 Servers
        env:
          MAX_WORKERS: "10"
          CONNECT_TIMEOUT: "15"
          DOWNLOAD_TIMEOUT: "35"
          MIN_SPEED: "10"
        run: |
          python scripts/hysteria2_tester.py

      
      - name: Show Results
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "Hysteria2 Results"
          echo "=================================="

          OUTPUT_FILE="results/hysteria2.txt"
          BACKUP_FILE="results/$(date +'%Y')/$(date +'%m')/$(date +'%d').txt"

          if [ -f "$OUTPUT_FILE" ]; then
            echo ""
            echo "Valid servers:"
            wc -l < "$OUTPUT_FILE"

          echo "=================================="

            echo ""
            echo "First 10 servers:"
            head -n 10 "$OUTPUT_FILE"

          echo "=================================="

            echo ""
            echo "Output file:"
            echo "$OUTPUT_FILE"

            echo ""
            echo "Daily backup:"
            if [ -f "$BACKUP_FILE" ]; then
              echo "$BACKUP_FILE"
              echo "Backup lines:"
              wc -l < "$BACKUP_FILE"
            else
              echo "Backup file not found."
            fi

          else
            echo "No result file found."
          fi

          echo ""
          echo "=================================="

      - name: Commit Results
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "Update tested Hysteria2 servers"
          file_pattern: results/**
